name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.x', '1.26.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          test -z "$unformatted"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Tests and race detection
        run: go test -race ./...
      - name: Check documented examples
        run: |
          go run ./cmd/bomrun -workflow examples/workflows/basic.yaml -check
          go run ./cmd/bomrun -workflow examples/workflows/presets.yaml -check
