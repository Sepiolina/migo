name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.x', '1.26.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum
      - name: Quality checks
        run: make check
      - name: Engine kit
        if: matrix.go == '1.26.x'
        run: go run ./tools/enginepack -out dist/mai-engine.zip
      - uses: actions/upload-artifact@v4
        if: matrix.go == '1.26.x'
        with:
          name: mai-engine-kit
          path: dist/mai-engine.zip
          if-no-files-found: error
