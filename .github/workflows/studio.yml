name: Mai Studio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
        working-directory: apps/studio
      - run: npm test
        working-directory: apps/studio
      - run: npm run build
        working-directory: apps/studio
      - run: node scripts/build-sidecar.mjs
        working-directory: apps/studio
      - run: cargo fmt --check
        working-directory: apps/studio/src-tauri
      - run: cargo test --locked
        working-directory: apps/studio/src-tauri
