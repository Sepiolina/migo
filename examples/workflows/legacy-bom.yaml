# The original Go BOM pipeline, executed in this exact order.
workflow: Legacy BOM processing
engine: bom
input:
  bom: ../../testdata/bom_basic.xlsx
  priority: ../../testdata/prio_basic.xlsx
# read-inputs must be first and write-workbook must be last.
# Dependencies: group-rows -> pcb-scope -> pcb-reformat ->
# cft-001-vendor-policy -> material-master -> sap-enrich.
# cft-002-priority requires grouping, scope and vendor policy; any enabled
# material-master and sap-enrich stages must also precede it.
# Set enabled: false on BOTH enrichment stages to skip external lookups.
process:
  - stage: read-inputs
  - stage: group-rows
  - stage: pcb-scope
  - stage: pcb-reformat
  - stage: cft-001-vendor-policy
  - stage: material-master
  - stage: sap-enrich
  - stage: cft-002-priority
  - stage: write-workbook
output:
  file: generated/legacy-bom.xlsx
