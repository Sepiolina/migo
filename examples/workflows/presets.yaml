workflow: Summarize parts with shared presets
imports: [shared-presets.yaml]
input:
  parts: parts.xlsx
presets:
  styles:
    local_report:
      preset: report
      override:
        header: {color: "#17365D"}
process:
  - from: parts["Parts"]
    as: summary
    do:
      - pipeline: {preset: clean}
      - group:
          by: [Part Number]
          aggregation_preset: quantities
      - sort: {by: [Part Number], order: ascending}
      - style: {preset: local_report}
output:
  - file: generated/presets.xlsx
    sheets: {Parts: summary}
