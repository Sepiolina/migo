# Supply the workbooks and headers described in docs/WORKFLOWS.md first.
workflow: Compare and enrich purchasing parts
input:
  current: current.xlsx
  previous: previous.xlsx
  catalog: catalog.xlsx
process:
  - from: previous["Parts"]
    as: baseline
    do: []
  - from: catalog["Catalog"]
    as: prices
    do:
      - deduplicate: {columns: [Part Number]}
  - from: current["Parts"]
    as: current_parts
    do:
      - forward_fill: {columns: [Category]}
      - map:
          columns:
            - {from: Part Number, to: Part Number}
            - {from: Description, to: Description}
            - {from: Quantity, to: Quantity}
            - {from: Category, to: Category}
      - filter:
          all:
            - {column: Part Number, blank: false}
            - {column: Quantity, greater_than: 0}
      - group:
          by: [Part Number]
          aggregate: {Description: first, Quantity: sum, Category: first}
  - from: current_parts
    as: changes
    do:
      - compare:
          with: baseline
          by: [Part Number]
          columns: [Description, Quantity]
  - from: current_parts
    as: purchasing
    do:
      - join:
          with: prices
          on: [Part Number]
          how: inner
      - calculate:
          column: Extended Cost
          operation: multiply
          columns: [Quantity, Unit Cost]
      - sort: {by: [Extended Cost], numeric: true, order: descending}
      - style:
          header: {bold: true}
          auto_width: true
          freeze_header: true
          number_formats: {Quantity: "0.00", Unit Cost: "0.00", Extended Cost: "0.00"}
output:
  - file: generated/purchasing.xlsx
    sheets: {Changes: changes, Purchasing: purchasing}
