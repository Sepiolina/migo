# A generic table workflow. Run it locally:
#   go run ./cmd/migo -in parts=examples/parts.xlsx -out summary.xlsx examples/parts-summary.yaml
# or copy it to <config dir>/workflows/ to serve /api/parts-summary/upload.
name: Parts summary
input:
  parts: {label: Parts list}

steps:
  - from: parts[Parts]
  - set:
      PartNumber: trim(col("Part Number"))
  - filter: 'PartNumber != "" && num(Quantity) > 0'
  - group: {by: [PartNumber], first: [Description], sum: [Quantity]}
  - sort: {by: [PartNumber]}
  - if: 'any(rows, #.Quantity >= 5)'
    then:
      - log: 'Large quantities: {join(map(filter(rows, #.Quantity >= 5), #.PartNumber), ", ")}'
  - save: summary

output:
  sheets:
    - name: Parts
      from: summary
      freeze: true
      header: {fill: "#D9EAF7"}
      columns:
        - {header: Part Number, column: PartNumber, width: 16}
        - {header: Description, width: 30}
        - {header: Quantity, number_format: "0", width: 10}
      styles:
        - {when: Quantity >= 5, columns: [Quantity], font: {bold: true, color: "#C62828"}}
